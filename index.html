<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>查我的幸运抽奖券 · Oxygrainz × HERMÈS</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',-apple-system,sans-serif;background:linear-gradient(165deg,#F6E3C6 0%,#F3CFA0 45%,#EE9B55 100%);background-attachment:fixed;color:#2A1600;min-height:100vh;padding:20px 16px 60px}
.w{max-width:520px;margin:0 auto}
.hd{text-align:center;padding:26px 0 22px}
.logos{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:16px}
.lg-oxy{height:34px;width:auto}
.lg-her{height:40px;width:auto}
.logos .x{font-size:17px;color:#B4A98C;font-weight:300}
h1{font-family:'Noto Serif SC',serif;font-weight:900;font-size:30px;color:#40200A;margin:8px 0 6px}
.hd p{font-size:14px;color:#8A7B5A}
.card{background:#FFF9EE;border:1.5px solid #E4BE8A;border-radius:16px;padding:22px;margin-bottom:14px}
label{display:block;font-size:14px;font-weight:700;color:#40200A;margin-bottom:8px}
input{width:100%;padding:14px 16px;border:1.5px solid #E4BE8A;border-radius:12px;font-size:17px;font-family:'IBM Plex Mono',monospace;background:#fff}
input:focus{outline:none;border-color:#EB4B02;box-shadow:0 0 0 3px rgba(235,75,2,.12)}
button{width:100%;margin-top:12px;padding:15px;border:none;border-radius:12px;background:linear-gradient(135deg,#EE7B22,#EB4B02);color:#fff;font-size:16px;font-weight:900;cursor:pointer;font-family:inherit}
button:active{transform:scale(.99)}
button:disabled{background:#C9BFA8}
.hint{font-size:12.5px;color:#8A7B5A;margin-top:10px;text-align:center}
#out{display:none}
.hero{background:linear-gradient(150deg,#40200A,#6B3A12);border-radius:16px;padding:26px 22px;text-align:center;color:#EDD9B4;margin-bottom:14px}
.hero .nm{font-size:14px;color:#EDD9B4}
.hero .big{font-family:'IBM Plex Mono',monospace;font-size:52px;font-weight:700;color:#FFCA50;line-height:1.1;margin:6px 0 2px}
.hero .u{font-size:15px;color:#fff;font-weight:700}
.eb{display:inline-block;margin-top:10px;background:#EB4B02;color:#fff;font-size:12px;font-weight:700;padding:5px 14px;border-radius:99px}
.pct{background:#FFF0DC;border:1.5px solid #EB4B02;border-radius:16px;padding:20px;margin-bottom:14px;text-align:center}
.pct .n{font-family:'IBM Plex Mono',monospace;font-size:40px;font-weight:700;color:#EB4B02;line-height:1}
.pct .t{font-size:14px;color:#A8390B;font-weight:700;margin-top:4px}
.bar{background:#EBD5B4;border-radius:99px;height:12px;margin-top:14px;overflow:hidden}
.bar i{display:block;height:12px;background:linear-gradient(90deg,#EE7B22,#EB4B02);border-radius:99px;transition:width .8s}
.bar i.g{background:#25D366}
.pct .lb{font-size:12.5px;color:#A8390B}
.nxtBox{margin-top:18px;padding-top:16px;border-top:1.5px dashed #E9B87A}
.nxtL{font-size:12.5px;color:#8A7B5A}
.nxtN{font-family:'IBM Plex Mono',monospace;font-size:34px;font-weight:700;color:#1D9E75;line-height:1.05;margin:4px 0 2px}
h3{font-size:15px;color:#40200A;margin-bottom:12px}
.ser{display:flex;flex-wrap:wrap;gap:7px}
.ser span{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:700;background:#FFEFD8;border:1.5px solid #E4BE8A;border-radius:9px;padding:8px 12px;color:#40200A}
.dl{display:block;margin-top:14px;padding:14px;background:linear-gradient(135deg,#40200A,#6B3A12);color:#FFCA50;text-align:center;border-radius:12px;text-decoration:none;font-weight:700;font-size:15px}
.up{background:#FFF9EE;border:2px dashed #EB4B02;border-radius:16px;padding:20px;text-align:center}
.up .l{font-size:14px;color:#8A7B5A}
.up .m{font-size:19px;font-weight:900;color:#40200A;margin:6px 0}
.up .m b{color:#EB4B02}
.tick{display:none;background:#FFF9EE;border:1.5px solid #E4BE8A;border-radius:14px;padding:14px 16px;margin-bottom:12px;overflow:hidden}
.tick .lbl{font-size:11px;color:#B4A98C;letter-spacing:.15em;margin-bottom:6px}
.tick .row{font-size:14px;color:#40200A;transition:opacity .35s,transform .35s}
.tick .row.out{opacity:0;transform:translateY(-8px)}
.tick .row b{color:#EB4B02}
.tick .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#25D366;margin-right:7px;vertical-align:1px}
.tick .dot.gold{background:#FFCA50}
#tick2{margin-top:0;margin-bottom:14px}
.cd{background:linear-gradient(150deg,#40200A,#6B3A12);border-radius:16px;padding:18px 16px;margin-bottom:12px;text-align:center;color:#EDD9B4}
.cd .lb{font-size:12px;color:#C9B78E;letter-spacing:.12em}
.cd .grid{display:flex;justify-content:center;gap:8px;margin-top:10px}
.cd .u{background:#5A3010;border:1px solid #8A5526;border-radius:10px;padding:9px 0;min-width:62px}
.cd .u b{display:block;font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:700;color:#FFCA50;line-height:1}
.cd .u span{font-size:10.5px;color:#C9B78E}
.cd.eb{background:linear-gradient(150deg,#A8390B,#EB4B02)}
.cd.eb .lb{color:#FFE8D0}
.cd.eb .u{background:rgba(0,0,0,.18);border-color:rgba(255,255,255,.25)}
.cd.eb .u b{color:#fff}
.cd.eb .u span{color:#FFE8D0}
.backBar{display:none;background:#FFF9EE;border:1.5px solid #E4BE8A;border-radius:12px;padding:11px 16px;margin-bottom:12px;font-size:13.5px;color:#8A7B5A}
.backBar span{font-family:'IBM Plex Mono',monospace;color:#40200A;font-weight:700}
.backBar a{color:#EB4B02;font-weight:700;text-decoration:none;float:right}
.err{background:#FFF0DC;border:1.5px solid #E4BE8A;border-radius:16px;padding:24px;text-align:center;font-size:15px;color:#8A7B5A}
.grp{display:flex;align-items:center;justify-content:center;gap:12px;background:#25D366;color:#fff;border-radius:16px;padding:17px 20px;text-decoration:none;text-align:left;margin-bottom:14px}
.grp .t{font-size:17px;font-weight:900}
.grp .s{font-size:13px;opacity:.92;margin-top:4px}
.ft{text-align:center;font-size:12px;color:#8A7B5A;margin-top:24px;line-height:1.7}
</style>
</head>

async function lookup(){
  var phone = document.getElementById("ph").value.replace(/[^0-9]/g,"");
  var out = document.getElementById("out");
  var btn = document.getElementById("go");

  if (phone.length < 8){
    out.style.display="block";

         + '<div class="u">张幸运抽奖券</div>'
         + (j.earlyBird ? '<div class="eb">早鸟券数已翻倍</div>' : '')
         + '</div>';

      if (j.percentile !== null && j.percentile !== undefined){
        h += '<div class="pct">'
           + '<div class="lb">你的券数赢过</div>'
           + '<div class="n">' + j.percentile + '%</div>'
           + '<div class="t">的参与者</div>'
           + '<div class="bar"><i style="width:' + j.percentile + '%"></i></div>';
        if (j.percentileNext !== null && j.percentileNext > j.percentile && j.nextTier){
          h += '<div class="nxtBox">'
             + '<div class="nxtL">升级到 ' + esc(j.nextTier.label) + ' ' + esc(j.nextTier.price) + ' 之后</div>'
             + '<div class="nxtN">' + j.percentileNext + '%</div>'
             + '<div class="bar"><i class="g" style="width:' + j.percentileNext + '%"></i></div>'
             + '<div class="nxtL" style="margin-top:8px">往上跳 ' + (j.percentileNext - j.percentile) + ' 个百分点</div>'
             + '</div>';
        }
        h += '</div>';
      } else {
        h += '<div class="pct"><div class="t" style="font-size:15px;color:#A8390B">活动刚开始</div>'
           + '<div class="t" style="font-weight:400;margin-top:4px">你是最早参与的一批，'
           + '现在券池最小、机会最集中</div></div>';

      h += '<div class="card"><h3>你的券号</h3><div class="ser">'
         + j.serials.map(function(n){ return '<span>' + n + '</span>'; }).join('')
         + '</div>';
      if (j.folder){
        h += '<a class="dl" href="' + esc(j.folder) + '" target="_blank">📥 下载我的抽奖券图片</a>';

      h += '</div>';

        h += '<div class="up"><div class="l">想要更多机会？</div>'
           + '<div class="m">升级到 ' + esc(j.nextTier.label) + ' <b>' + esc(j.nextTier.price) + '</b></div>'

function tickCountdown(){

  if (cd.dataset.on !== "1") return;              // 首页不显示

  var now = new Date(), target, label, isEB = false;
  if (now < EB_END){ target = EB_END; label = "早鸟券 ×2 剩下"; isEB = true; }

  cd.style.display = "block";

  var d = Math.max(0, target - now);
  var dd = Math.floor(d/86400000), hh = Math.floor(d/3600000)%24,
      mm = Math.floor(d/60000)%60, ss = Math.floor(d/1000)%60;

  document.getElementById("cd").className = "cd" + (isEB ? " eb" : "");
  document.getElementById("cdLb").textContent = label;
  document.getElementById("cdGrid").innerHTML =
      unit(dd,"天") + unit(hh,"小时") + unit(mm,"分") + unit(ss,"秒");

var BASE_TICK = [
  '<span class="dot gold"></span>1st Prize　<b>HERMÈS 包包</b> × 1 位得主',
  '<span class="dot gold"></span>2nd Prize　<b>HERMÈS 耳环</b> × 2 位得主',
  '<span class="dot gold"></span>3rd Prize　<b>HERMÈS 项链</b> × 1 位得主',
  '<span class="dot gold"></span>4th Prize　<b>Philips 气炸锅</b> × 2 位得主',
  '<span class="dot gold"></span>5th Prize　<b>Oxygrainz 三罐装</b> × 5 位得主',
  '<span class="dot"></span>2 罐 RM358　＝ <b>1</b> 张券',
  '<span class="dot"></span>3 罐 RM509　＝ <b>2</b> 张券',
  '<span class="dot"></span>5 罐 RM799　＝ <b>4</b> 张券',
  '<span class="dot"></span>7 罐 RM1,088　＝ <b>6</b> 张券',
  '<span class="dot"></span>10 罐 RM1,488　＝ <b>10</b> 张券',
  '<span class="dot"></span>早鸟期下单　券数 <b>×2</b>',
  '<span class="dot"></span>全场 <b>11</b> 位得主　一人限中一份'
];

async function loadTicker(){
  var real = [];
  try{
    var r = await fetch(API + "?action=recentdraws");
    var j = await r.json();
    if (j.items && j.items.length){
      real = j.items.map(function(x){
        return '<span class="dot"></span>' + esc(x.name)
             + '　获得 <b>' + x.qty + '</b> 张抽奖券';
      });
    }
  }catch(e){}

  // 真实订单穿插进固定内容里，看起来最自然
  TICK = BASE_TICK.slice();
  real.forEach(function(x, i){ TICK.splice((i * 3 + 1) % (TICK.length + 1), 0, x); });

  // 每次载入顺序都不一样
  for (var i = TICK.length - 1; i > 0; i--){
    var k = Math.floor(Math.random() * (i + 1));
    var t = TICK[i]; TICK[i] = TICK[k]; TICK[k] = t;
  }

  showTick();
  tickTimer = setInterval(nextTick, 3000);
}

function showTick(){
  document.getElementById("tickRow2").innerHTML = TICK[tickI % TICK.length];
}

function nextTick(){
  var el = document.getElementById("tickRow2");
  el.classList.add("out");
  setTimeout(function(){
    tickI++;
    showTick();
    el.classList.remove("out");
  }, 350);
}

function reset(){
  document.getElementById("searchCard").style.display = "";
  document.getElementById("tick2").style.display = "none";
  var c = document.getElementById("cd");
  c.dataset.on = ""; c.style.display = "none";
  document.getElementById("grpTop").style.display = "";
  document.querySelector(".hd").style.display = "";
  document.getElementById("backBar").style.display = "none";
  document.getElementById("out").style.display = "none";
  document.getElementById("ph").value = "";
  window.scrollTo({top:0, behavior:"smooth"});
  document.getElementById("ph").focus();
}

document.getElementById("ph").addEventListener("keydown", function(e){
  if (e.key === "Enter") lookup();
});

tickCountdown();
setInterval(tickCountdown, 1000);
loadTicker();
</script>
</body></html>
